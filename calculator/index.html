<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        
        <div class="buttons">
            <button onclick="clearDisplay()" class="btn-clear">C</button>
            <button onclick="appendValue('/')" class="btn-operator">/</button>
            <button onclick="appendValue('*')" class="btn-operator">*</button>
            <button onclick="deleteLast()" class="btn-delete">Del</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')" class="btn-operator">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')" class="btn-operator">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()" class="btn-equal">=</button>

            <button onclick="appendValue('0')" class="btn-zero">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>

    const display = document.getElementById('display');
     
     // Adds numbers or operators to the screen
     function appendValue(value) {
         display.value += value;
     }

    // Clears the entire screen
    function clearDisplay() {
        display.value = '';
    }

    // Deletes just the last character entered
    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    // Computes the math equation safely
    function calculate() {
    try {
        // eval handles the string math like "7+5*2" perfectly
        if (display.value !== "") {
            display.value = eval(display.value);
        }
    } catch (error) {
        display.value = 'Error';
    }
   }
   
    </script>
</body>
</html>
