<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bootstrap Card</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Smooth transition for the background color change */
        .color-card {
            transition: background-color 0.3s ease, color 0.3s ease;
            cursor: pointer;
        }
    </style>
   </head>
   <body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card color-card shadow-sm" id="interactiveCard" style="width: 18rem;">
        <img src="https://picsum.photos/300/200" class="card-img-top" alt="Card Image">
        <div class="card-body">
            <h5 class="card-title">Hover Over Me!</h5>
            <p class="card-text">Move your mouse onto this card to see JavaScript dynamically change its background color.</p>
            <a href="#" class="btn btn-primary">Go somewhere</a>
        </div>
    </div>

    <script>
        // Grab the card element by its unique ID
        const card = document.getElementById('interactiveCard');

        //classList means attaching a class through javascript and the bgdark and text-white are bootstrap classes

        // Change color when mouse enters the card area
        card.addEventListener('mouseenter', () => {
            card.classList.add('bg-dark', 'text-white');
        });

        // Revert color when mouse leaves the card area
        card.addEventListener('mouseleave', () => {
            card.classList.remove('bg-dark', 'text-white');
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
