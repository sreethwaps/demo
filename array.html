<html>
    <head>
        <title>Javascript</title>
    </head>
    <body>
        <script>
            let fruits=["apple","mango","orange"];
            console.log("Fruits:",fruits);
            fruits.push("Watermelon");
            console.log("Fruits:",fruits);
            fruits.pop("mango");
            console.log("Fruits:",fruits);
            fruits.forEach(function(item){
                console.log("Fruits:",item);
            });
        </script>
    </body>
</html>
