<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height: 100vh;
        }
        .calculator{
            border: 4px solid black;
            padding:20px;
            background-color: azure;
        }
        #display{
            width:212px;
            height:40px;
            margin-bottom:10px;
            font-size:20px;
        }
        button {
            width:50px;
            height:60px;
            margin:2px;
            font-size:18px;
            background-color: bisque;
        }
        .delete{
            width: 50px;
            height: 60px;
            background-color: brown;
        }
        .btn-equal {
            background-color: rgb(200, 77, 77);
            grid-row: span 2; 
        }
        .oper{
            background-color: rgb(187, 123, 123);
        }
    </style>
</head>
<body>
<div class="calculator">
    <input type="text" id="display">
    <br>
    <button onclick="clearDisplay()">C</button>
    <button class="oper" onclick="appendValue('+')">+</button>
    <button  class="oper" onclick="appendValue('-')">-</button>
    <button class="delete" onclick="deletevalue()">Del</button>
    <br>
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="oper" onclick="appendValue('*')">*</button>
    <br>
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="oper" onclick="appendValue('/')">/</button>
    <br>
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
     <button onclick="result()" class="btn-equal">=</button>
    <br>
    <button onclick="sign('+/-')">+/-</button>
    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="oper" onclick="appendValue('%')">%</button>
</div>
<script>
function appendValue(value){
    document.getElementById("display").value += value;
}
function clearDisplay(){
    document.getElementById("display").value = "";
}
function deletevalue(){
    display.value= display.value.slice(0,-1);
}
function result(){
   try {
        if (display.value !== "") {
            display.value = eval(display.value);
        }
    } catch (error) {
        display.value = 'Error';
    }
}
function sign() {
    let display = document.getElementById("display");
    if (display.value.startsWith("-")) {
        display.value = display.value.substring(1);
    } else {
        display.value = "-" + display.value;
    }
}
</script>
</body>
</html>
