<!DOCTYPE html>
<html>
<head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="edb">
        <h3>EXAM BOOKS</h3>
    </div>

    <div class="container">

        <div class="card" style="width:20rem;">
            <img src="e7.jpg" alt="Book Image">
            <p class="price">&#8377;350</p>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <div class="card" style="width:20rem;">
            <img src="e6.jpg" alt="Book Image">
            <p class="price">&#8377;600</p>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <div class="card" style="width:20rem;">
            <img src="e5.jpg" alt="Book Image">
            <p class="price">&#8377;900</p>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <div class="card" style="width:20rem;">
            <img src="e4.jpg" alt="Book Image">
            <p class="price">&#8377;490</p>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <div class="card" style="width:20rem;">
            <img src="e3.jpg" alt="Book Image">
            <p class="price">&#8377;490</p>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <div class="card" style="width:20rem;">
            <img src="e3.jpg" alt="Book Image">
            <p class="price">&#8377;400</p>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <div class="card" style="width:20rem;">

        </div>

        <div class="card" style="width:20rem;">

            <p class="price">&#8377;490</p>
            <button class="cart-btn">Add to Cart</button>
        </div>

    </div>

    <button onclick="window.location.href='book.html'">
        Back
    </button>

    <script>
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.classList.add('bg-dark', 'text-white');
            });

            card.addEventListener('mouseleave', () => {
                card.classList.remove('bg-dark', 'text-white');
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
