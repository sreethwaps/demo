<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url("bkt.jpg");
            background-repeat: no-repeat;
            background-size: cover;
        }

        h1 {
            text-align: center;
        }

        input, select {
            width: 90%;
            padding: 8px;
            margin-top: 5px;
        }

        .signupbox {
            width: 350px;
            padding: 25px;
            border-radius: 20px;
            background-color: rgb(230, 186, 136);
            font-size: large;
            font-weight: bold;
        }

        button {
            width: 100px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background-color: black;
            color: white;
            cursor: pointer;
            display: block;
            margin: 10px auto;
        }

        button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <div class="signupbox">
        <h1>SIGNUP</h1>

        <form id="myform">
            <label for="username">Username</label><br>
            <input type="text" id="username" required><br><br>

            <label for="phoneno">Phone Number</label><br>
            <input type="tel" id="phoneno" required><br><br>

            <label for="email">Email</label><br>
            <input type="email" id="email" required><br><br>

            <label for="gender">Gender</label><br>
            <select id="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select><br><br>

            <label for="address">Address</label><br>
            <input type="text" id="address" required><br><br>

            <label for="pincode">Pincode</label><br>
            <input type="text" id="pincode" required><br><br>

            <label for="city">City</label><br>
            <input type="text" id="city" required><br><br>

            <label for="state">State</label><br>
            <input type="text" id="state" required><br><br>

            <label for="password">Password</label><br>
            <input type="password" id="password" required><br><br>

            <label for="confirmpassword">Confirm Password</label><br>
            <input type="password" id="confirmpassword" required><br><br>

            <button type="submit">Save</button>
        </form>
    </div>

    <script>
        document.getElementById("myform").addEventListener("submit", function(event) {

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmpassword").value;

            if (password !== confirmPassword) {
                event.preventDefault();
                alert("Passwords do not match!");
            } else {
                alert("Signup Successful!");
            }
        });

        document.getElementById("username").addEventListener("focus", function() {
            console.log("Username field focused");
        });
    </script>
</body>
</html>
