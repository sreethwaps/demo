<html>
<head>
    <title>Books Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: url("app.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    font-family: Arial, sans-serif;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}
.edb {
    text-align: center;
    width: 100%;
    font-weight: bold;
    font-size: x-large;
    padding: 20px;
    color: white;
}

.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    width: 250px;
    padding: 15px;
    transition: transform 0.3s ease;
}

.card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 8px;
}

.price {
    font-weight: 900;
    font-size: 18px;
    margin: 10px 0;
}

.card:hover {
    transform: translateY(-8px);
}

.cart-btn {
    background-color: grey;
    border: none;
    border-radius: 5px;
    width: 120px;
    height: 40px;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
}

.cart-btn:hover {
    background-color: black;
    box-shadow: 0 5px 15px white;
}

button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    color: white;
    background-color: black;
    border: none;
    border-radius: 8px;
    width: 90px;
    height: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    background-color: #333;
    transform: scale(1.05);
}
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="bks">
        <h3>BOOKS STORE</h3>
    </div>
    <div class="container">
        <div class="card" style="width: 20rem;">
    <img src="sp.jpg" alt="Sapiens">
    <p class="price">$550</p>
    <button class="cart-btn">Add to Cart</button>
</div>

<div class="card" style="width: 20rem;">
    <img src="ah.jpg" alt="Atomic Habits">
    <p class="price">$400</p>
    <button class="cart-btn">Add to Cart</button>
</div>
<div class="card" id="interactiveCard" style="width: 20rem;">
    <img src="bh.jpg" alt="Brief History of Time">
    <p class="price">$450</p>
    <button class="cart-btn">Add to Cart</button>
</div>

<div class="card" id="interactiveCard" style="width: 20rem;">
    <img src="ed.jpg" alt="Educated">
    <p class="price">$600</p>
    <button class="cart-btn">Add to Cart</button>
</div>

<div class="card" id="interactiveCard" style="width: 20rem;">
    <img src="ph.jpg" alt="Psychology">
    <p class="price">$600</p>
    <button class="cart-btn">Add to Cart</button>
</div>

<div class="card" id="interactiveCard" style="width: 20rem;">
    <img src="po.jpg" alt="Malayalam Book">
    <p class="price">$350</p>
    <button class="cart-btn">Add to Cart</button>
</div>

<div class="card" id="interactiveCard" style="width: 20rem;">
    <img src="pi.jpg" alt="War and Peace">
    <p class="price">$650</p>
    <button class="cart-btn">Add to Cart</button>
</div>
</div>
<button onclick="window.location.href='book.html'">Back</button>
    <script>
        const card = document.querySelectorAll('.card');
        card.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.classList.add('bg-dark', 'text-white');
            });
            card.addEventListener('mouseleave', () => {
                card.classList.remove('bg-dark', 'text-white');
            });
        });
    </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
